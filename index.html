<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;display:flex;height:100vh;color:#222}

</style></head><body>
<div id="side"><header><h1>Avon Gorge caves &ndash; bat survey</h1>
<button onclick="addCave()">+ Add cave</button><button onclick="layerDlg()">+ Map layer</button><button onclick="ghDlg()">GitHub sync</button><button onclick="linkFile()">Link save file</button><button onclick="exp('json')">Export JSON</button><button onclick="exp('csv')">Export CSV</button><button onclick="document.getElementById('imp').click()">Import</button><input id="imp" type="file" accept=".json" hidden>

<div class="bar"><input id="q" placeholder="Search caves"><select id="bk"><option value="">Both banks</option><option>West</option><option>East</option><option>Unknown</option></select></div>

<div id="map"></div><dialog id="dlg"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// id,name,MCR id,locality,bank,lat,lon,NGR,length,depth,notes  (source: Mendip Cave Registry, mcra.org.uk/registry)
const D=[
["lcc","Lower Cliff Cave",1911,"Stokeleigh Camp","West",51.45735,-2.63469,"ST 55999 73344",10,3,"Narrow rift ending in stalagmite choke."],
["ucc","Upper Cliff Cave",1912,"Stokeleigh Camp","West",51.45735,-2.63469,"ST 55999 73344",15,2,"6 m above Lower Cliff Cave in ivy; difficult climb."],

["scc","Stokeleigh Camp Cave",2006,"Stokeleigh Camp","West",51.45708,-2.63394,"ST 56051 73313",10,1,"Ledge below N edge of camp; crawl. Alt: Rodway Ruckle."],
["ian","Ian's Cave",1904,"Stokeleigh Camp","West",51.45706,-2.63385,"ST 56057 73311",2,1,"Choked archway, may connect to Stokeleigh Camp Cave."],

["c2","Cave Two",3151,"Leigh Woods","West",51.45768,-2.63328,"ST 56097 73379",0,0,"LOST (Tratman); position approximate."],
["ske","Skeleton Cave",2011,"Stokeleigh Camp","West",51.4564,-2.63286,"ST 56125 73237",4,2,"Circular chamber; Neolithic remains (archaeological)."],
["hpr","Hundred Percent Rock Shelter",3065,"Stokeleigh Camp","West",51.45617,-2.63315,"ST 56105 73212",1,1,"Small shelter leading to tiny tube."],
["sad","Sadam's Cave",2116,"Leigh Woods","West",51.45921,-2.63297,"ST 5612 7355",0,0,"No description; low-precision position."],

["nvc","Nightingale Valley Cave",1997,"Nightingale Valley","West",51.4548,-2.63447,"ST 56012 73060",8,4,"High on S side; phreatic tube chokes. Alt: Bloke's Cave."],
["cic","Cinema Cave",2106,"Nightingale Valley","West",51.45517,-2.63234,"ST 5616 7310",2,1,"Low slot high on S bank."],
["crs","Cinema Rock Shelter",3068,"Nightingale Valley","West",51.45497,-2.63188,"ST 56192 73077",2,1,"Overhang only."],
["lw3","Leigh Woods Mine 3",3811,"Leigh Woods","West",51.46135,-2.63703,"ST 5584 7379",null,null,"2 m choked sloping mine passage."],
["rwh","Red Wall Holes",3420,"Leigh Woods","West",51.46166,-2.63309,"ST 56114 73822",null,null,"Solutional cavities in red cliff, W edge of the Great Slab."],
["ft1","Avon Gorge Firing Tunnel 1",2110,"Hotwells","East",51.45832,-2.63138,"ST 5623 7345",0,0,"Low-precision position; bank to be checked."],
["ft2","Avon Gorge Firing Tunnel 2",2111,"Hotwells","East",51.45896,-2.6298,"ST 5634 7352",0,0,"Low-precision position; bank to be checked."],
["ft3","Avon Gorge Firing Tunnel 3",2112,"Hotwells","East",51.45726,-2.62891,"ST 5640 7333",0,0,"Low-precision position; bank to be checked."],
["prt","Portnalls Railway Tunnels",2107,"Hotwells","East",51.45682,-2.62853,"ST 56426 73281",160,0,"Old railway tunnels; WWII shelter, firing range; all access sealed."],
["jak","Jack's Hole",1905,"Hotwells","East",51.45758,-2.62856,"ST 56425 73366",5,0,"Part-quarried shelter above Battleship Buttress."],
["u6","U6",2105,"Hotwells","East",51.45609,-2.6271,"ST 56525 73199",0,0,"LOST. Alt: Bin Laden's Cave."],
["itd","In Through The Out Door Cave",3211,"Hotwells","East",51.45647,-2.62706,"ST 56528 73241",3,3,"Short vertical loop above Giant's Cave balcony; climb."],
["gcb","Giant's Cave Balcony",3217,"Hotwells","East",51.4564,-2.62709,"ST 56526 73233",65,27,"Viewing-platform entrance to Giant's Cave (same system)."],
["gc","Giant's Cave",1827,"Clifton Down","East",51.45663,-2.6264,"ST 56574 73259",65,27,"Show cave, medieval hermitage; entered via 1835 tunnel; CROW land."],
// No coordinates retrieved yet: use Edit to add (copy WGS84 from MCR page)
...[["Observatory Hill Cave",2123,"Clifton Down","East"],["Lower Cave",2016,"Hotwells","East"],["Upper Cave",2015,"Hotwells","East"],["Hades Cave",1828,"Gorge","Unknown"],["Hell Gates Cave",3210,"Gorge","Unknown"],["Burwalls Cave",1812,"Gorge","Unknown"],["The Adit",1810,"Gorge","Unknown"],["North Wall Hollow",3421,"Gorge","Unknown"],["Zig Zag Rock Shelter",2709,"Gorge","Unknown"],["Colonnade Cave",3101,"Gorge","Unknown"],["Clifton Rocks Railway",2280,"Hotwells","East"],["Rownham Hill Cave",2704,"Gorge","Unknown"],["Slab Quarry Cave",2000,"Leigh Woods","West"],["Knicker Nitch",1910,"Leigh Woods","West"],["Mouse Hole",1996,"Leigh Woods","West"],["Pool Cave",1999,"Leigh Woods","West"],["Percavity Cave",1998,"Leigh Woods","West"],["Mercavity Cave",1914,"Leigh Woods","West"],["Shatter Hole",2010,"Leigh Woods","West"],["Main Wall Grotto",1913,"Gorge","Unknown"],["Leigh Down Mine",1995,"Leigh Woods","West"]].map(a=>["m"+a[1],a[0],a[1],a[2],a[3],null,null,"",null,null,"Coordinates not yet entered; see MCR page."])
];
const SP=["Greater horseshoe","Lesser horseshoe","Natterer's","Daubenton's","Whiskered/Brandt's","Brown long-eared","Barbastelle","Bechstein's","Serotine","Noctule","Common pipistrelle","Soprano pipistrelle","Myotis sp.","Unidentified"];
const K="avongorge_bats_v1";let S;try{S=JSON.parse(localStorage.getItem(K))}catch(x){}S=S||{edits:{},added:[],visits:{}};
let fh=null,dirty=0;const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){alert("Could not save to browser storage; export now.")}dirty++;writeFile();ghSoon()};
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id),fd=d=>d?new Date(d).toLocaleDateString("en-GB"):"";
const keys=["id","name","mcr","loc","bank","lat","lon","ngr","len","dep","note"];
const caves=()=>D.map(a=>Object.assign(Object.fromEntries(keys.map((k,i)=>[k,a[i]])),S.edits[a[0]]||{})).concat(S.added);
const V=id=>S.visits[id]||[],nb=id=>V(id).reduce((n,v)=>n+v.bats.reduce((m,b)=>m+(+b.n||0),0),0);
const stat=id=>!V(id).length?"#888":nb(id)?"#d62728":"#2ca02c";
const map=L.map("map").setView([51.4565,-2.631],15);
const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
const topo=L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{subdomains:"abc",maxNativeZoom:17,maxZoom:19,attribution:"Map data &copy; OpenStreetMap contributors, SRTM | Style &copy; OpenTopoMap (CC-BY-SA)"});
const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri, Maxar, Earthstar Geographics"});
const hill=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:16,maxZoom:19,opacity:.6,attribution:"Hillshade &copy; Esri"});
// BGS 1:50k bedrock: the service only draws between about 1:100,000 and 1:25,000, so request at zoom 12-13 and enlarge when zoomed in
const geo=L.tileLayer.wms("https://map.bgs.ac.uk/arcgis/services/BGS_Detailed_Geology/MapServer/WMSServer",{layers:"BGS.50k.Bedrock",format:"image/png",transparent:true,crs:L.CRS.EPSG4326,minZoom:12,minNativeZoom:12,maxNativeZoom:13,maxZoom:19,opacity:.6,attribution:"Contains British Geological Survey materials &copy; UKRI 2026"});
const NLS="Courtesy of the National Library of Scotland";
const os10k=L.tileLayer("https://mapseries-tilesets.s3.amazonaws.com/os/britain10knatgrid/{z}/{x}/{y}.png",{maxNativeZoom:16,maxZoom:19,attribution:NLS+" (OS 1:10,560, 1940s-60s)"});
const os25=L.layerGroup([L.tileLayer("https://geo.nls.uk/mapdata3/os/25_inch_holes_england/{z}/{x}/{y}.png",{maxNativeZoom:17,maxZoom:19}),L.tileLayer("https://mapseries-tilesets.s3.amazonaws.com/25_inch/gloucestershire/{z}/{x}/{y}.png",{maxNativeZoom:17,maxZoom:19,attribution:NLS+" (OS 25-inch, 1892-1914)"})]);
// Environment Agency LiDAR 1 m hillshade (ArcGIS image service, requested in Web Mercator)
const Img=L.TileLayer.extend({getTileUrl(c){const z=this._getZoomForUrl(),n=40075016.6855785/Math.pow(2,z),x0=c.x*n-20037508.3428,y1=20037508.3428-c.y*n;return this._url+"/exportImage?f=image&format=png&transparent=true&bboxSR=3857&imageSR=3857&size=256,256&bbox="+[x0,y1-n,x0+n,y1].join(",")}});
const lidar=new Img("https://environment.data.gov.uk/image/rest/services/SURVEY/LIDAR_Composite_1m_DTM_2022_Hillshade/ImageServer",{maxNativeZoom:18,maxZoom:19,opacity:.6,attribution:"LiDAR &copy; Environment Agency 2022"});
// Natural England designations, fetched for the visible area
const NE="https://services.arcgis.com/JJzESW51TqeY9uat/ArcGIS/rest/services/";
function neLayer(svc,color,label){const g=L.geoJSON(null,{style:{color,weight:2,fillOpacity:.1},attribution:"&copy; Natural England; contains OS data &copy; Crown copyright and database right 2026",onEachFeature:(f,l)=>{const q=f.properties||{};l.bindPopup("<b>"+e(label)+"</b><br>"+e(q.SSSI_NAME||q.SAC_NAME||q.NNR_NAME||q.NAME||""))}});
 const load=async()=>{if(!map.hasLayer(g))return;const b=map.getBounds(),u=NE+svc+"/FeatureServer/0/query?where=1%3D1&geometry="+[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]+"&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&outSR=4326&maxAllowableOffset=0.00005&f=geojson";try{const j=await(await fetch(u)).json();g.clearLayers();g.addData(j)}catch(x){}};
 g.on("add",load);map.on("moveend",load);return g}
const sssi=neLayer("SSSI_England","#7b2d8e","SSSI"),sac=neLayer("Special_Areas_of_Conservation_England","#c2185b","SAC"),nnr=neLayer("National_Nature_Reserves_England","#00796b","National Nature Reserve");
const lc=L.control.layers({"OpenStreetMap":osm,"OpenTopoMap (terrain)":topo,"Satellite (Esri)":sat,"Old OS 1:10,560, 1940s-60s (NLS)":os10k,"Old OS 25-inch, 1892-1914 (NLS, Gloucestershire side)":os25},{"Bedrock geology (BGS)":geo,"Hillshade (Esri)":hill,"LiDAR hillshade 1 m (EA)":lidar,"SSSI (Natural England)":sssi,"SAC (Natural England)":sac,"National Nature Reserve (Natural England)":nnr},{collapsed:true}).addTo(map);
let CL=[];try{CL=JSON.parse(localStorage.getItem("agbs_layers"))||[]}catch(x){}const CLs={};
function addCL(c){const l=L.tileLayer(c.url,{maxZoom:19,attribution:e(c.name)});CLs[c.name]=l;lc.addBaseLayer(l,c.name+" (custom)")}CL.forEach(addCL);
function layerDlg(){$("dlg").innerHTML=`<h3>Custom map layers</h3><p class="sub">Paste an XYZ tile URL containing {z}, {x} and {y}, including any API key (for example from MapTiler, Thunderforest or OS Maps). It is saved only in this browser, never in your records or exports.</p><label>Name</label><input id="ln"><label>Tile URL (https)</label><input id="lu" placeholder="https://.../{z}/{x}/{y}.png?key=..."><p><button onclick="saveCL()"><b>Add</b></button> <button onclick="$('dlg').close()">Close</button></p>${CL.map((c,i)=>`<div class="visit">${e(c.name)} <button style="float:right" onclick="delCL(${i})">Remove</button></div>`).join("")}`;$("dlg").showModal()}
function saveCL(){const n=$("ln").value.trim(),u=$("lu").value.trim();if(!n||!/^https:\/\//.test(u)||!/\{z\}/.test(u)||!/\{x\}/.test(u)||!/\{y\}/.test(u)){alert("Enter a name and an https URL containing {z}, {x} and {y}.");return}CL.push({name:n,url:u});localStorage.setItem("agbs_layers",JSON.stringify(CL));addCL(CL[CL.length-1]);layerDlg()}
function delCL(i){const c=CL.splice(i,1)[0];localStorage.setItem("agbs_layers",JSON.stringify(CL));if(CLs[c.name]){lc.removeLayer(CLs[c.name]);map.removeLayer(CLs[c.name])}layerDlg()}
const opc=L.control({position:"bottomleft"});opc.onAdd=()=>{const d=L.DomUtil.create("div","leaflet-bar");d.style.cssText="background:#fff;padding:4px 8px;font-size:12px";d.innerHTML='Overlay opacity <input type="range" min="10" max="100" value="60">';L.DomEvent.disableClickPropagation(d);d.querySelector("input").oninput=ev=>{[geo,hill,lidar].forEach(l=>l.setOpacity(ev.target.value/100))};return d};opc.addTo(map);
const mk={};let cur=null;
function refresh(){const q=$("q").value.toLowerCase(),b=$("bk").value,all=caves();
 Object.values(mk).forEach(m=>m.remove());
 all.forEach(c=>{if(c.lat==null)return;mk[c.id]=L.circleMarker([c.lat,c.lon],{radius:8,color:c.bank=="West"?"#e07b00":c.bank=="East"?"#1f77b4":"#555",weight:3,fillColor:stat(c.id),fillOpacity:.9}).addTo(map).bindTooltip(c.name).on("click",()=>sel(c.id))});
 $("list").innerHTML=all.filter(c=>(!b||c.bank==b)&&(c.name+c.loc).toLowerCase().includes(q)).map(c=>`<div class="row ${c.id==cur?"on":""}" onclick="sel('${c.id}')"><b>${e(c.name)}</b>${V(c.id).length?`<span class="tag ${nb(c.id)?"r":"g"}">${V(c.id).length} visit${V(c.id).length>1?"s":""}${nb(c.id)?", "+nb(c.id)+" bats":""}</span>`:""}${c.lat==null?'<span class="tag o">no coords</span>':""}<div class="sub">${e(c.bank)} &middot; ${e(c.loc)}</div></div>`).join("");
 const vs=Object.values(S.visits).flat();$("sum").textContent=`${all.length} caves, ${all.filter(c=>c.lat!=null).length} mapped, ${all.filter(c=>V(c.id).length).length} surveyed, ${vs.length} visits`}
function sel(id){cur=id;const c=caves().find(x=>x.id==id);if(c.lat!=null)map.setView([c.lat,c.lon],Math.max(map.getZoom(),17));
 $("det").innerHTML=`<h2>${e(c.name)}</h2><div class="sub">${e(c.bank)} bank &middot; ${e(c.loc)}${c.ngr?" &middot; "+e(c.ngr):""}${c.len!=null?` &middot; ${c.len} m long, ${c.dep} m deep`:""}</div><p>${e(c.note)}</p>
 <button onclick="visit('${id}')">+ Add survey visit</button> <button onclick="editCave('${id}')">Edit cave</button> ${c.mcr?`<a href="https://www.mcra.org.uk/registry/sitedetails.php?id=${c.mcr}" target="_blank" rel="noopener">MCR record</a>`:""}
 <h3 style="font-size:13px">Survey visits</h3>${V(id).map((v,i)=>`<div class="visit"><b>${fd(v.date)}</b> &ndash; ${e(v.surv)} <button style="float:right" onclick="visit('${id}',${i})">Edit</button><br>${v.bats.length?v.bats.map(b=>`${e(b.n)} &times; ${e(b.sp)}${b.sex?", "+e(b.sex):""}${b.st?", "+e(b.st):""}${b.loc?" ("+e(b.loc)+")":""}${b.ring?" ring "+e(b.ring):""}${b.rem?" &ndash; "+e(b.rem):""}`).join("<br>"):"<i>No bats found</i>"}${v.notes?`<br><small>${e(v.notes)}</small>`:""}</div>`).join("")||'<span class="sub">None recorded.</span>'}`;refresh()}
const opt=(a,v)=>a.map(x=>`<option${x==v?" selected":""}>${e(x)}</option>`).join("");
const batRow=(b={})=>`<div class="bat"><div class="g2"><div><label>Species</label><select class="sp">${opt(SP,b.sp)}</select></div><div><label>Number</label><input class="n" type="number" min="1" value="${e(b.n||1)}"></div>
<div><label>Sex</label><select class="sx">${opt(["Unknown","Male","Female","Mixed"],b.sex)}</select></div><div><label>State</label><select class="st">${opt(["Torpid","Awake","Active/flying","Dead"],b.st)}</select></div>
<div><label>Location in cave</label><input class="lc" value="${e(b.loc)}"></div><div><label>Ring / ID number</label><input class="rg" value="${e(b.ring)}"></div></div><label>Remarks</label><input class="rm" value="${e(b.rem)}"><button type="button" onclick="this.parentNode.remove()">Remove bat record</button></div>`;
function visit(id,i){const v=i==null?{date:new Date().toISOString().slice(0,10),surv:"",bats:[],notes:""}:V(id)[i];
 $("dlg").innerHTML=`<h3>${i==null?"New":"Edit"} survey visit &ndash; ${e(caves().find(c=>c.id==id).name)}</h3><div class="g2"><div><label>Date</label><input id="vd" type="date" value="${v.date}"></div><div><label>Surveyors</label><input id="vs" value="${e(v.surv)}"></div></div>
 <h4>Bats found <small>(none added = no bats)</small></h4><div id="bats">${v.bats.map(batRow).join("")}</div><button type="button" onclick="$('bats').insertAdjacentHTML('beforeend',batRow())">+ Add bat record</button>
 <label>Other notes (conditions, disturbance, signs, temperature&hellip;)</label><textarea id="vn" rows="4">${e(v.notes)}</textarea><p><button onclick="saveV('${id}',${i==null?-1:i})"><b>Save</b></button> ${i==null?"":`<button onclick="delV('${id}',${i})">Delete visit</button> `}<button onclick="$('dlg').close()">Cancel</button></p>`;$("dlg").showModal()}
function saveV(id,i){const v={date:$("vd").value,surv:$("vs").value,notes:$("vn").value,bats:[...document.querySelectorAll("#bats .bat")].map(r=>({sp:r.querySelector(".sp").value,n:r.querySelector(".n").value,sex:r.querySelector(".sx").value,st:r.querySelector(".st").value,loc:r.querySelector(".lc").value,ring:r.querySelector(".rg").value,rem:r.querySelector(".rm").value}))};
 if(!v.date){alert("Please enter a date.");return}const a=S.visits[id]=V(id).slice();i<0?a.push(v):a[i]=v;a.sort((x,y)=>y.date.localeCompare(x.date));save();$("dlg").close();sel(id)}
function delV(id,i){if(confirm("Delete this visit record?")){S.visits[id].splice(i,1);save();$("dlg").close();sel(id)}}
function caveForm(c,isNew){$("dlg").innerHTML=`<h3>${isNew?"Add":"Edit"} cave</h3><label>Name</label><input id="cn" value="${e(c.name)}"><div class="g2"><div><label>Latitude (WGS84)</label><input id="cla" value="${c.lat??""}"></div><div><label>Longitude</label><input id="clo" value="${c.lon??""}"></div>
 <div><label>Bank</label><select id="cb">${opt(["West","East","Unknown"],c.bank)}</select></div><div><label>Locality</label><input id="cl" value="${e(c.loc)}"></div><div><label>NGR</label><input id="cg" value="${e(c.ngr)}"></div><div><label>MCR ID</label><input id="cm" value="${e(c.mcr)}"></div></div>
 <label>Notes</label><textarea id="cno" rows="3">${e(c.note)}</textarea><p><button onclick="saveC('${c.id||""}')"><b>Save</b></button> <button onclick="$('dlg').close()">Cancel</button></p>`;$("dlg").showModal()}
const addCave=()=>caveForm({},true),editCave=id=>caveForm(caves().find(c=>c.id==id));
function saveC(id){const f=(k,v)=>v===""?null:+v,o={name:$("cn").value,lat:f(0,$("cla").value),lon:f(0,$("clo").value),bank:$("cb").value,loc:$("cl").value,ngr:$("cg").value,mcr:$("cm").value,note:$("cno").value};
 if(!o.name||(o.lat==null)!=(o.lon==null)){alert("Name needed; give both latitude and longitude, or neither.");return}
 if(id){const a=S.added.find(c=>c.id==id);a?Object.assign(a,o):S.edits[id]=Object.assign(S.edits[id]||{},o)}else{id="u"+Date.now();S.added.push(Object.assign({id},o))}
 save();$("dlg").close();sel(id)}
function dl(n,t,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function exp(t){const d=new Date().toISOString().slice(0,10);if(t=="json"){dirty=0;note();return dl(`avon-gorge-bats-${d}.json`,JSON.stringify(S,null,1),"application/json")}
 const q=x=>`"${String(x??"").replace(/"/g,'""')}"`,r=[["Cave","Bank","Locality","NGR","Date","Surveyors","Species","Number","Sex","State","Location in cave","Ring/ID","Bat remarks","Visit notes"].map(q).join(",")];
 caves().forEach(c=>V(c.id).forEach(v=>(v.bats.length?v.bats:[{}]).forEach(b=>r.push([c.name,c.bank,c.loc,c.ngr,v.date,v.surv,b.sp,b.n,b.sex,b.st,b.loc,b.ring,b.rem,v.notes].map(q).join(",")))));dl(`avon-gorge-bats-${d}.csv`,"\ufeff"+r.join("\n"),"text/csv")}
$("imp").onchange=ev=>{const f=ev.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!j.visits)throw 0;if(confirm("Replace all records in this browser with the imported file?")){S={edits:j.edits||{},added:j.added||[],visits:j.visits};save();cur=null;refresh()}}catch(x){alert("Not a valid export file.")}})};
let gh=null,ghMsg="",ghT=0,ghSha=null,ghBlock=false;try{gh=JSON.parse(localStorage.getItem("agbs_gh"))}catch(x){}
const on=()=>gh&&gh.token;
const note=()=>{$("bk2").textContent=[fh?"Autosaving to file: "+fh.name:"",on()?ghMsg:"",!fh&&!on()&&dirty?"Unbacked-up changes: "+dirty+". Use GitHub sync, link a save file or export JSON.":""].filter(Boolean).join(" \u00b7 ")};
const b64=t=>btoa(unescape(encodeURIComponent(t))),unb64=t=>decodeURIComponent(escape(atob(t.replace(/\s/g,""))));
const ghU=()=>`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${gh.path}`,ghH=()=>({Authorization:"Bearer "+gh.token,Accept:"application/vnd.github+json"});
const applyS=j=>{S={edits:j.edits||{},added:j.added||[],visits:j.visits};try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}cur=null;dirty=0;ghBlock=false;refresh()};
async function ghPull(){const r=await fetch(ghU()+(gh.branch?"?ref="+encodeURIComponent(gh.branch):""),{headers:ghH(),cache:"no-store"});
 if(r.status==404){ghSha=null;return null}if(!r.ok)throw new Error("GitHub said "+r.status+(r.status==401?" (token not accepted)":r.status==403?" (token lacks permission)":""));
 const j=await r.json();ghSha=j.sha;const d=JSON.parse(unb64(j.content));if(!d.visits)throw new Error("That file is not a survey records file");return d}
async function ghPush(){if(!on()||ghBlock)return;ghMsg="Saving to GitHub\u2026";note();
 try{const r=await fetch(ghU(),{method:"PUT",headers:ghH(),body:JSON.stringify({message:"Update survey records "+new Date().toISOString().slice(0,16),content:b64(JSON.stringify(S,null,1)),sha:ghSha||undefined,branch:gh.branch||undefined})});
 if(r.ok){ghSha=(await r.json()).content.sha;dirty=0;ghMsg="Saved to GitHub "+new Date().toLocaleTimeString("en-GB")}
 else if(r.status==409||r.status==422){ghBlock=true;ghMsg="\u26a0 GitHub copy has changed elsewhere. Open GitHub sync and pull before saving."}
 else ghMsg="\u26a0 GitHub save failed ("+r.status+"). Records are still in this browser; export a backup."}catch(x){ghMsg="\u26a0 GitHub save failed (offline?). Records are still in this browser."}note()}
function ghSoon(){clearTimeout(ghT);if(on()&&!ghBlock)ghT=setTimeout(ghPush,2500)}
function ghDlg(){const g=gh||{};$("dlg").innerHTML=`<h3>GitHub sync</h3><p class="sub">Saves your records to a JSON file in a <b>private</b> repository (never the public page's repo). Create a fine-grained personal access token limited to that one repo with <b>Contents: read and write</b> and an expiry date. The token is kept only in this browser.</p>
<div class="g2"><div><label>GitHub username</label><input id="go" value="${e(g.owner||"")}"></div><div><label>Private repo name</label><input id="gr" value="${e(g.repo||"")}"></div><div><label>File path</label><input id="gp" value="${e(g.path||"avon-gorge-bats.json")}"></div><div><label>Branch (blank = default)</label><input id="gb" value="${e(g.branch||"")}"></div></div>
<label>Access token</label><input id="gt" type="password" value="${e(g.token||"")}" autocomplete="off"><p><button onclick="ghConnect()"><b>Connect and sync</b></button> ${on()?'<button onclick="ghPullBtn()">Pull from GitHub</button> <button onclick="ghOff()">Disconnect</button> ':""}<button onclick="$(\'dlg\').close()">Close</button></p><div id="gm" class="sub"></div>`;$("dlg").showModal()}
async function ghConnect(){const v=i=>$(i).value.trim();gh={owner:v("go"),repo:v("gr"),path:v("gp").replace(/^\//,""),branch:v("gb"),token:v("gt")};
 if(!gh.owner||!gh.repo||!gh.path||!gh.token){$("gm").textContent="Please fill in every field except branch.";return}
 try{const j=await ghPull();localStorage.setItem("agbs_gh",JSON.stringify(gh));ghBlock=false;
  if(j&&confirm("Records already exist on GitHub.\nOK = load them here (replaces records in this browser).\nCancel = keep this browser's records and overwrite the GitHub copy.")){applyS(j);ghMsg="Loaded from GitHub"}else await ghPush();
  note();$("dlg").close()}catch(x){gh=null;try{gh=JSON.parse(localStorage.getItem("agbs_gh"))}catch(y){}$("gm").textContent="Could not connect: "+x.message}}
async function ghPullBtn(){try{const j=await ghPull();if(!j){$("gm").textContent="No file on GitHub yet.";return}if(confirm("Replace records in this browser with the GitHub copy?")){applyS(j);ghMsg="Loaded from GitHub "+new Date().toLocaleTimeString("en-GB");note();$("dlg").close()}}catch(x){$("gm").textContent="Pull failed: "+x.message}}
function ghOff(){if(confirm("Remove the token and GitHub settings from this browser? Records on GitHub stay as they are.")){gh=null;localStorage.removeItem("agbs_gh");ghMsg="";note();$("dlg").close()}}
async function writeFile(){if(fh){try{const w=await fh.createWritable();await w.write(JSON.stringify(S,null,1));await w.close();dirty=0}catch(x){fh=null;alert("Link to the save file was lost; please link it again.")}}note()}
async function linkFile(){if(!window.showSaveFilePicker)return alert("This browser cannot save straight to a file (use Chrome or Edge on a computer). Please use Export JSON instead.");
 const t=[{description:"JSON",accept:{"application/json":[".json"]}}];
 try{if(confirm("OK = open an existing save file (its records will replace those in this browser).\nCancel = create a new save file from the records in this browser.")){[fh]=await showOpenFilePicker({types:t});await fh.requestPermission({mode:"readwrite"});const j=JSON.parse(await(await fh.getFile()).text());if(!j.visits)throw 0;S={edits:j.edits||{},added:j.added||[],visits:j.visits};try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}cur=null;refresh();dirty=0}
 else{fh=await showSaveFilePicker({suggestedName:"avon-gorge-bats.json",types:t});await writeFile()}note()}catch(x){fh=null;if(x.name!="AbortError")alert("Could not link that file.")}}
addEventListener("beforeunload",ev=>{if(dirty&&!fh){ev.preventDefault();ev.returnValue=""}});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
$("q").oninput=$("bk").onchange=refresh;refresh();
</script></body></html>
